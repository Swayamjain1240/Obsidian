name: Obsidian CI

on:
  push:
    branches: [main, fix/production-stabilization]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test

      - name: Dependency audit
        run: npm run audit

      - name: Build workspaces
        run: npm run build

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run e2e --workspace frontend

      - name: Build isolated worker image
        run: docker buildx build --progress=plain --load --tag obsidian-sandbox:dev infra/sandbox

      - name: Generate worker provenance and SBOM attestations
        run: docker buildx build --progress=plain --provenance=true --sbom=true --output=type=oci,dest=/tmp/obsidian-sandbox.oci.tar infra/sandbox

      - name: Verify worker image policy
        run: npm run verify:worker-image

      - name: Scan worker image when Docker Scout is available
        run: |
          if docker scout version >/dev/null 2>&1; then
            docker scout cves --only-severity critical,high local://obsidian-sandbox:dev
            docker scout cves --exit-code --only-severity critical local://obsidian-sandbox:dev
          else
            echo "Docker Scout is unavailable; production vulnerability scanning remains a deployment requirement."
          fi

      - name: Docker worker integration tests
        env:
          OBSIDIAN_DOCKER_TESTS: '1'
        run: npm run test --workspace backend -- src/workers src/baseline/docker-integration.test.ts src/workflow/change-worker-docker.integration.test.ts

      - name: Check diff whitespace
        run: git diff --check
